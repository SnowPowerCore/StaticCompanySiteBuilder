<!doctype html>
<html>
<head>
    <title>Static Company Website</title>

    <style type="text/css">
        [x-cloak] { display: none !important; }
        .site-shell { max-width: 1200px; }
        .hero-gradient {
            background: linear-gradient(135deg, var(--bs-danger), var(--bs-secondary));
            color: #fff;
        }
        [data-bs-theme="dark"] .hero-gradient {
            background: linear-gradient(135deg, var(--bs-danger), var(--bs-dark));
        }
        .hero-nav-link {
            color: rgba(255,255,255,.92);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: all .2s ease;
        }
        .hero-nav-link:hover { color: #fff; border-bottom-color: #fff; }
        .section-heading { font-weight: 700; letter-spacing: .01em; }
        .hover-lift { transition: transform .2s ease, box-shadow .2s ease; }
        .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 .75rem 1.5rem var(--bs-border-color-translucent); }
        .tag-pill { font-weight: 600; }
        .nav-button { white-space: nowrap; }
        .section-card { border-radius: .9rem; }
        @media (max-width: 767px) {
            .hero-gradient { padding: 1.25rem !important; }
            .section-heading { font-size: 1.1rem; }
        }
        /* Remove borders from cards inside the site shell to get a cleaner modern look */
        .site-shell .border {
            border: none !important;
        }
        .site-shell .border-top {
            border-top: none !important;
        }
        .site-shell .section-card {
            border: none !important;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="bundle.js"></script>

</head>

<body>
    <div id="app-main"></div>
</body>

<template id="index">
    <div x-template="'companySite'"></div>
</template>

</html>
